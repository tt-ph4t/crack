<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="ledger-folds" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" result="dust"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.15" numOctaves="2" stitchTiles="stitch" result="folds"/>
      <feComposite operator="arithmetic" k1="0.4" k2="0.6" in="dust" in2="folds" result="heightmap"/>
      <feDiffuseLighting in="heightmap" lighting-color="#78909C" surfaceScale="1.5" result="light">
        <feDistantLight azimuth="90" elevation="65"/>
      </feDiffuseLighting>
      <feBlend mode="screen" in="SourceGraphic" in2="light"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#14171A" filter="url(#ledger-folds)"/>
</svg>
