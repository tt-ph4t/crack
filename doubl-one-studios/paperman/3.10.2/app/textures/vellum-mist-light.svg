<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="vellum-clouds" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="5" stitchTiles="stitch" result="clouds"/>
      <feColorMatrix
        in="clouds"
        type="matrix"
        values="0 0 0 0 0.14  0 0 0 0 0.19  0 0 0 0 0.25  0.42 0.42 0.42 0 0"
        result="cloudTint"
      />
    </filter>
    <filter id="vellum-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.35" numOctaves="2" stitchTiles="stitch" result="grain"/>
      <feColorMatrix
        in="grain"
        type="matrix"
        values="0 0 0 0 0.08  0 0 0 0 0.10  0 0 0 0 0.13  0.24 0.24 0.24 0 0"
        result="grainTint"
      />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#5E728A" fill-opacity="0.28"/>
  <rect width="100%" height="100%" filter="url(#vellum-clouds)" opacity="0.95"/>
  <rect width="100%" height="100%" filter="url(#vellum-grain)" opacity="0.70"/>
</svg>
